; DropDeck — override PHP
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Upload: harus >= DROPDECK_MAX_FILE_MB (default 100 MB) + overhead
upload_max_filesize = 110M
post_max_size = 120M
max_file_uploads = 20

; Opsi sesi/cookie diatur Laravel, bukan di sini.
date.timezone = UTC

; OPcache (produksi). Di dev, validate_timestamps tetap aktif.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
